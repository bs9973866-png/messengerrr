<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b7cd3">
  <title>Мессенджер</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232b7cd3'/%3E%3Cpath d='M16 20h32v20H30l-8 8v-8h-6z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=feature-bundle11">
</head>
<body>
  <div id="auth" class="auth" hidden>
    <form id="authForm" class="auth-card" autocomplete="on">
      <div class="logo"><svg class="brand-icon"><use href="#i-chat"/></svg></div>
      <h1>Мессенджер</h1>
      <div class="tabs">
        <button type="button" id="tabLogin" class="active">Вход</button>
        <button type="button" id="tabRegister">Регистрация</button>
      </div>
      <input id="fName" name="name" placeholder="Ваше имя" maxlength="40" autocomplete="name" hidden>
      <input id="fUser" name="username" placeholder="Логин (латиница, цифры, _)" maxlength="24" autocomplete="username" autocapitalize="none" required>
      <input id="fPass" name="password" type="password" placeholder="Пароль (от 6 символов)" maxlength="200" autocomplete="current-password" required>
      <div id="authError" class="error" role="alert"></div>
      <button class="primary" id="authSubmit" type="submit">Войти</button>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <button id="menuBtn" class="menu-fab" type="button" aria-label="Открыть меню" aria-expanded="false"><span></span><span></span><span></span></button>
    <div id="drawerShade" class="drawer-shade"></div>
    <aside id="side" class="side">
      <header class="side-head">
        <button id="meBtn" class="me" title="Профиль"></button>
        <div class="grow"></div>
        <button id="notifBtn" class="icon" title="Включить уведомления" hidden><svg class="ui-icon"><use href="#i-bell"/></svg></button>
        <button id="newChatBtn" class="icon" title="Новый чат"><svg class="ui-icon"><use href="#i-plus"/></svg></button>
        <button id="newGroupBtn" class="icon" title="Новая группа"><svg class="ui-icon"><use href="#i-users"/></svg></button>
      </header>
      <div class="search"><input id="chatSearch" placeholder="Поиск по чатам" autocomplete="off"></div>
      <div id="chatList" class="chat-list"></div>
      <div id="connState" class="conn" hidden>Соединение…</div>
    </aside>

    <main id="main" class="main">
      <div id="empty" class="empty">
        <div class="logo big"><svg class="brand-icon"><use href="#i-chat"/></svg></div>
        <p>Выберите чат или начните новый</p>
      </div>
      <section id="chatView" class="chat-view" hidden>
        <header class="chat-head">
          <button id="backBtn" class="icon back" title="Назад"><svg class="ui-icon"><use href="#i-chat"/></svg></button>
          <div id="headInfo" class="head-info"></div>
          <button id="audioCallBtn" class="icon" title="Аудиозвонок"><svg class="ui-icon"><use href="#i-mic"/></svg></button>
          <button id="videoCallBtn" class="icon" title="Видеозвонок"><svg class="ui-icon"><use href="#i-camera"/></svg></button>
        </header>
        <div id="messages" class="messages"></div>
        <button id="toBottom" class="to-bottom" hidden title="Вниз">↓<span id="toBottomBadge"></span></button>
        <div id="dropHint" class="drop-hint" hidden>Отпустите, чтобы отправить файлы</div>
        <footer class="composer-wrap">
          <div id="ctxBar" class="ctx-bar" hidden></div>
          <div id="composer" class="composer">
            <button id="attachBtn" class="icon" title="Прикрепить файл"><svg class="ui-icon"><use href="#i-clip"/></svg></button>
            <textarea id="input" rows="1" placeholder="Сообщение" maxlength="4000"></textarea>
            <button id="micBtn" class="icon" title="Голосовое сообщение"><svg class="ui-icon"><use href="#i-mic"/></svg></button>
            <button id="camBtn" class="icon" title="Видеосообщение (кружок)"><svg class="ui-icon"><use href="#i-camera"/></svg></button>
            <button id="sendBtn" class="icon send" title="Отправить" hidden><svg class="ui-icon"><use href="#i-send"/></svg></button>
            <input id="fileInput" type="file" multiple hidden>
          </div>
          <div id="recBar" class="rec-bar" hidden></div>
        </footer>
      </section>
    </main>
  </div>

  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-5.5A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></symbol>
<symbol id="i-feed" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 8h4v4H7zM14 8h4M14 12h4M7 16h11"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></symbol>
<symbol id="i-shop" viewBox="0 0 24 24"><path d="M4 9h16l-1 11H5L4 9Z"/><path d="M8 9V6a4 4 0 0 1 8 0v3M9 13v1M15 13v1"/></symbol>
<symbol id="i-sticker" viewBox="0 0 24 24"><path d="M20 13a7 7 0 1 1-9-9 7 7 0 0 1 9 9Z"/><path d="M13 20v-5a2 2 0 0 1 2-2h5M8 10h.01M12 8h.01"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1 1.2 1-1.5 2.6-1.5-.6a8 8 0 0 1-1.7 1l-.3 1.6h-3l-.3-1.6a8 8 0 0 1-1.8-1l-1.4.6-1.5-2.6 1.2-1a7 7 0 0 1 0-2l-1.2-1 1.5-2.6 1.4.6a8 8 0 0 1 1.8-1l.3-1.6h3l.3 1.6a8 8 0 0 1 1.7 1l1.5-.6 1.5 2.6-1.2 1a7 7 0 0 1 0 2Z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></symbol>
<symbol id="i-clip" viewBox="0 0 24 24"><path d="m8 12 7-7a4 4 0 0 1 6 6l-9 9a6 6 0 0 1-9-9l9-9"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></symbol>
<symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7h4l2-3h4l2 3h4a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="4"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/></symbol>
<symbol id="i-gift" viewBox="0 0 24 24"><path d="M3 10h18v11H3zM2 6h20v4H2zM12 6v15M12 6H8a3 3 0 1 1 3-3l1 3Zm0 0h4a3 3 0 1 0-3-3l-1 3Z"/></symbol>
<symbol id="i-snow" viewBox="0 0 24 24"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7M8 4l4 3 4-3M8 20l4-3 4 3M3 11l4-1 1-4M21 13l-4 1-1 4M3 13l4 1 1 4M21 11l-4-1-1-4"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 8.8c0 5.1-8.8 11-8.8 11s-8.8-5.9-8.8-11A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 8.8 2.8Z"/></symbol>
<symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5c-.7-.7-1.7-1-3-1-1.8 0-3 .9-3 2.2s1.2 2 3 2.3 3 .9 3 2.2-1.2 2.3-3.2 2.3c-1.3 0-2.4-.4-3.1-1.2M12.2 5.5v13"/></symbol>
</svg>
  <div id="layer"></div>
  <script src="app.js?v=feature-bundle11"></script>
</body>
</html>
